      <stop stop-color="#07111F"/>
      <stop offset="0.46" stop-color="#0D2746"/>
      <stop offset="1" stop-color="#114563"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 740) rotate(90) scale(280 520)">
      <stop stop-color="#3B82F6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1280 160) rotate(90) scale(320 420)">
      <stop stop-color="#34D9C6" stop-opacity="0.54"/>
